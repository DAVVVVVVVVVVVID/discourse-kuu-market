  admin_js:
    admin:
      site_settings:
        categories:
          discourse_kuu_market: "KUU 二手市场"
  js:
    kuu_market:
      new_topic:
        label: "二手出售 / 求购"
        description: "出售、赠送或求购二手物品"
      kinds:
        sell: "出售"
        buy: "求购"
      trade_methods:
        pickup: "自取"
        delivery: "可送"
        negotiable: "可商议"
      form:
        new_title: "发布二手帖"
        edit_title: "修改二手帖"
        kind: "类型"
        item_name: "物品名称"
        item_name_placeholder: "例：宜家书桌"
        free: "免费赠送"
        price: "价格（日元）"
        budget: "预算"
        budget_min: "最低预算（日元）"
        budget_max: "最高预算（日元）"
        location: "交易地点"
        location_placeholder: "例：吉田本校区、百万遍"
        trade_method: "交易方式"
        description: "补充说明"
        privacy_hint: "不要填手机号、详细住址，请用私信联系"
        photos: "照片"
        reference_photo: "参考图（选填）"
        photos_hint:
          one: "最多 %{count} 张"
          other: "最多 %{count} 张，第一张做封面"
        add_photos: "添加照片"
        cover: "封面"
        make_cover: "设为封面"
        remove_photo: "删除这张照片"
        publish: "发布"
        save: "保存"
        pending_approval: "已提交，管理员审核通过后就会发布。"
        errors:
          required: "必填"
          budget_required: "最低、最高预算至少填一个"
          budget_order: "最高预算不能低于最低预算"
          too_many_photos: "最多 %{count} 张"
      # 列表卡片上的状态比帖子页短一点（2026-10-20 David 定：求购中 → 求购）
      # closed 是求购帖成交（2026-10-21 David 定：「结束」改成「已购买」，Issue #5 第三期）
      card_statuses:
        selling: "在售"
        sold: "已出"
        buying: "求购"
        closed: "已购买"
        expired: "已过期"
      statuses:
        selling: "在售"
        sold: "已出"
        buying: "求购中"
        closed: "已购买"
        expired: "已过期"
      panel:
        edit: "修改"
        expires_on: "%{date} 自动过期"
        change_to:
          selling: "重新上架"
          sold: "标记已出"
          buying: "继续求购"
          closed: "标记已购买"
        confirm_end:
          sell: "标记已出后会关闭回复，帖子不再出现在列表和搜索里，但大家仍能在你个人主页的「话题」里看到（链接也能打开）。以后可以重新上架。确定吗？"
          buy: "标记已购买后会关闭回复，帖子不再出现在列表和搜索里，但大家仍能在你个人主页的「话题」里看到（链接也能打开）。以后可以继续求购。确定吗？"
        deal:
          title:
            sell: "标记已出：选择成交对象"
            buy: "标记已购买：选择成交对象"
          description:
            sell: "从举手的同学里选一位作为成交对象。其他举手的同学会收到你的私聊「抱歉，货物已售出」。标记后会关闭回复，帖子不再出现在列表和搜索里，但大家仍能在你个人主页的「话题」里看到。"
            buy: "从举手的同学里选一位作为成交对象。其他举手的同学会收到你的私聊「抱歉，已经收到东西啦」。标记后会关闭回复，帖子不再出现在列表和搜索里，但大家仍能在你个人主页的「话题」里看到。"
          none: "无（在其他渠道成交）"
          partner: "成交对象"
        ended: "状态已更新。"
        relisted_and_bumped: "已重新上架，并顶回了「最新」最上面。"
        relisted_without_bump: "已重新上架。这次没有顶帖（每 %{days} 天最多顶一次），%{date} 之后再重新上架就会顶帖。"
      # 举手的文案是 David 在 Issue #5 里定的（2026-10-21）
      hands:
        raise:
          sell: "举手购买"
          buy: "举手售出"
        raised: "已举手"
        cancel: "取消举手"
        # 举手后、发帖人收到举手提醒时弹窗里的两个按钮（Issue #9，2026-10-22 David 定）
        open_chat: "去私信"
        keep_browsing: "继续浏览"
        confirm_cancel:
          sell: "取消后会私信告诉卖家同学。确定取消举手吗？"
          buy: "取消后会私信告诉该同学。确定取消举手吗？"
        count:
          sell: "%{count} 位同学想购买"
          buy: "%{count} 位同学可以提供"
        more: "还有 %{count} 位"
        sent:
          raised:
            sell: "已经发送信息告诉该卖家同学，请关注私信内容哦~"
            buy: "已经发送信息告诉该同学，请关注私信内容哦~"
          cancelled:
            sell: "已经私信该卖家同学取消购买请求"
            buy: "已经私信该同学取消请求"
        poster_unavailable:
          raised:
            sell: "已举手。卖家关闭了私聊，可以在帖子下面回复"
            buy: "已举手。该同学关闭了私聊，可以在帖子下面回复"
          cancelled:
            sell: "已取消举手。卖家关闭了私聊，没能私信通知"
            buy: "已取消举手。该同学关闭了私聊，没能私信通知"
        failed:
          raised: "已举手，但私信没能发出去，可以在帖子下面回复"
          cancelled: "已取消举手，但私信没能发出去"
      # 发帖人的举手提醒弹窗（Issue #5 第二期，文案是 David 在 Issue 里定的）
      hand_alert:
        line:
          sell: "有 %{count} 位同学想要购买你出售的『%{item}』"
          buy: "有 %{count} 位同学想要提供你求购的『%{item}』"
        hint: "快去私信查收吧~"
      notifications:
        expired_sell: "已过期，可以重新上架或标记已出"
        expired_buy: "已过期，可以继续求购或标记结束"
        expired_title: "二手帖已过期"
        hand_expired_sell: "卖家的帖子已过期"
        hand_expired_buy: "求购的帖子已过期"
        hand_expired_title: "举手的二手帖已过期"
