en:
  site_settings:
    kuu_market_enabled: "Enable the KUU market (sell / buy forms, listing statuses, auto-expiry)."
    kuu_market_category: "Market category. New topics here can only be posted through the market form (staff excepted); replies are unaffected."
    kuu_market_expire_days: "Days a listing stays for sale or wanted before it expires automatically."
    kuu_market_bump_interval_days: "Minimum days between bumps to the top of Latest when a listing is relisted. Relisting within this interval still changes the status, without the bump."
    kuu_market_max_photos: "Maximum number of photos on a sell listing."
    kuu_market_hand_actions_per_day: "Maximum number of hand raises and cancellations (combined) per listing per user per day. Each one sends the author a chat message."
    kuu_market_default_location: "Meeting place prefilled in the listing form. Users can change it."
    kuu_market_placeholder_image: "Image on topic list cards of sell listings without photos (square, at least 400×400)."
    kuu_market_buy_image: "Image on every buy listing's topic list card (square, at least 400×400)."
  kuu_market:
    errors:
      use_market_form: "To post in the market, click \"New Topic\" in the market category and use the sell / buy form."
      kind_unchanged: "A listing cannot switch between selling and buying after it is posted."
      cannot_manage: "Only the author and staff can change this listing."
      status_unreachable: "This listing cannot be switched to that status."
      edit_with_market_form: "The title and first post of a listing come from its form. Use the \"Edit\" button on the listing instead."
      hand_already_raised: "You have already raised your hand."
      deal_user_not_in_queue: "Choose the buyer or seller from the people who raised their hand."
      too_many_hand_actions: "Raising and lowering your hand over and over sends the author a lot of messages. Please try again tomorrow!"
    listing:
      title:
        sell: "[For sale] %{item} · %{price}"
        free: "[Free] %{item}"
        buy: "[Wanted] %{item} · %{budget}"
      yen: "¥%{amount}"
      budget:
        range: "¥%{min}–%{max}"
        up_to: "up to %{max}"
        from: "%{min} or more"
      free: "Free"
      card:
        free: "Free"
      hand_messages:
        raised:
          sell: "Hi! I'd like to buy this. Could I ask you a few questions?"
          buy: "Hi! I have what you're looking for. Could I ask you a few questions?"
        cancelled:
          sell: "I no longer need it, so I'm withdrawing my request."
          buy: "I can't offer it for now, so I'm withdrawing."
        dealt:
          sell: "Sorry, this has been sold."
          buy: "Sorry, I've already got one."
      field_line: "- **%{label}:** %{value}"
      fields:
        price: "Price"
        budget: "Budget"
        location: "Meeting place"
        trade_method: "Handover"
        area: "Campus"
        categories: "Categories"
      areas:
        yoshida: "Yoshida"
        uji: "Uji"
        katsura: "Katsura"
        other: "Other"
      categories:
        furniture_appliances: "Furniture & appliances"
        electronics: "Electronics"
        clothing: "Clothing"
        transport_sports: "Transport & sports"
        entertainment: "Entertainment"
        study: "Textbooks & study"
        other: "Other"
      separator: ", "
      trade_methods:
        pickup: "Pick up"
        delivery: "Can deliver"
        negotiable: "Negotiable"
